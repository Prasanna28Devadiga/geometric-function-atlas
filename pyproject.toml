[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "geometric-function-atlas"
dynamic = ["version"]
description = "Reproducible computations for a geometric function theory atlas"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Prasanna Devadiga" },
  { name = "Arya Suneesh" },
  { name = "Kishan Gurumurthy" },
  { name = "Pushparaj Devadiga" },
  { name = "Asha Sebastian" },
]
keywords = [
  "geometric function theory",
  "Ma-Minda",
  "reproducible research",
  "certified computation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["mpmath>=1.3", "sympy>=1.12"]

[project.urls]
Homepage = "https://github.com/Prasanna28Devadiga/geometric-function-atlas"
Repository = "https://github.com/Prasanna28Devadiga/geometric-function-atlas"
Issues = "https://github.com/Prasanna28Devadiga/geometric-function-atlas/issues"

[project.optional-dependencies]
test = ["jsonschema>=4.23", "mypy>=1.15", "pytest>=8", "ruff>=0.16"]
build = ["build>=1.2", "twine>=5"]
lab = ["numpy>=1.24"]

[project.scripts]
geometric-function-atlas = "geometric_function_atlas.cli:main"
gfa = "geometric_function_atlas.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geometric_function_atlas = ["py.typed", "schema/*.json", "data/*.json", "data/*.md"]

[tool.setuptools.dynamic]
version = { attr = "geometric_function_atlas.version.__version__" }

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
