[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gft-registry"
dynamic = ["version"]
description = "Reproducible computations for geometric function theory registries"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Prasanna Devadiga" },
  { name = "Arya Suneesh" },
  { name = "Kishan Gurumurthy" },
  { name = "Pushparaj Devadiga" },
  { name = "Asha Sebastian" },
]
keywords = [
  "geometric function theory",
  "Ma-Minda",
  "reproducible research",
  "certified computation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",

  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["sympy>=1.12"]

[project.optional-dependencies]
test = ["mypy>=1.15", "pytest>=8", "ruff>=0.16"]
build = ["build>=1.2", "twine>=5"]

[project.scripts]
gft-registry = "gft_registry.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gft_registry = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "gft_registry.version.__version__" }

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
