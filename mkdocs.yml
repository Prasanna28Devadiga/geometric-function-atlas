site_name: Geometric Function Atlas
site_description: Reproducible and auditable computations for geometric function theory.
site_url: https://prasanna28devadiga.github.io/geometric-function-atlas/
strict: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Prasanna28Devadiga/geometric-function-atlas
      name: geometric-function-atlas source on GitHub

theme:
  name: material
  font: false
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    logo: material/math-integral-box
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            inherited_members: false
            members_order: source
            show_bases: false
            show_if_no_docstring: true
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
      toc_depth: 4

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Getting started:
      - Overview: index.md
      - First calculation: getting-started.md
  - Research workflows:
      - Choose a research question: workflows/README.md
      - Understand a new Ma–Minda class: workflows/custom_class.md
      - Investigate a coefficient problem: workflows/coefficient_comparison.md
      - Find and verify an inclusion radius: workflows/sharp_radius.md
      - Test a conjecture: workflows/conjecture_counterexample.md
      - Reproduce and adapt a published result: workflows/recent_literature.md
  - Reference:
      - Generators and coefficients: reference/generators-and-coefficients.md
      - Classes and extremals: reference/classes.md
      - Function verification: reference/verification.md
      - Counterexamples: reference/counterexamples.md
      - Directed radii: reference/radii.md
      - Plotting: reference/plotting.md
      - Alexander transform example: reference/alexander-transform.md
      - Registry snapshots: reference/snapshots.md
      - Bundles and records: reference/bundles-and-records.md
      - Citations and artifacts: reference/citations-and-artifacts.md
      - Result contract: RESULT_CONTRACT.md
      - Provenance policy: PROVENANCE.md
  - Developer documentation:
      - Website/package parity: WEB_PARITY.md
      - Capability inventory: ROADMAP.md
      - Release procedure: RELEASING.md
