name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: false
      - run: uv sync --extra test --extra lab --locked
      - run: uv run --frozen --extra test --extra lab python -W error -m pytest -q
      - run: uv run --frozen --extra test --extra lab python -m ruff check src tests scripts
      - run: uv run --frozen --extra test --extra lab python -m mypy src --ignore-missing-imports

  distribution:
    name: Distribution and managed-Python install
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: false
      - run: uv sync --extra test --extra build --locked
      - run: uv run --frozen --extra build python -m build
      - run: uv run --frozen --extra build python -m twine check dist/*
      - run: uv run --frozen python scripts/check_distribution.py dist
      - run: uv run --frozen python scripts/check_clean_install.py dist/geometric_function_atlas-0.1.1-py3-none-any.whl
      - run: uv run --frozen python scripts/check_uv_tool_install.py dist/geometric_function_atlas-0.1.1-py3-none-any.whl --python 3.12

  windows-installer:
    name: Windows PowerShell installer smoke
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Install local source as an isolated managed-Python tool
        shell: pwsh
        run: |
          $env:GFA_PACKAGE_SPEC = (Get-Location).Path
          $env:GFA_PYTHON_VERSION = "3.12"
          ./scripts/install.ps1
          gfa --version
