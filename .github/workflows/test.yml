name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install '.[test,build]'
      - run: python -m ruff check src tests
      - run: python -m mypy src --ignore-missing-imports
      - run: python -W error -m pytest -q
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python scripts/check_distribution.py dist
      - name: Smoke-test the wheel outside the checkout
        run: |
          python -m venv /tmp/geometric-function-atlas-wheel
          /tmp/geometric-function-atlas-wheel/bin/python -m pip install --quiet dist/*.whl
          cd /tmp
          /tmp/geometric-function-atlas-wheel/bin/python -c \
            "from geometric_function_atlas import fekete_szego; assert str(fekete_szego('exponential', mu=0).value) == '3/4'"
          /tmp/geometric-function-atlas-wheel/bin/python -m geometric_function_atlas generators --json >/tmp/geometric-function-atlas-generators.json
      - name: Smoke-test the sdist outside the checkout
        run: |
          python -m venv /tmp/geometric-function-atlas-sdist
          /tmp/geometric-function-atlas-sdist/bin/python -m pip install --quiet dist/*.tar.gz
          cd /tmp
          /tmp/geometric-function-atlas-sdist/bin/python -c \
            "from geometric_function_atlas import generator_series; assert str(generator_series('sine', order=2).coefficients[0]) == '1'"
